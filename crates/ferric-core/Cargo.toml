[package]
name = "ferric-core"
version = "0.1.0"
edition = "2021"
authors = ["DEADC0DE"]
description = "Core IRC protocol engine and crypto for Ferric"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
blowfish = "0.9"
byteorder = "1.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cipher = { version = "0.4", features = ["block-padding"] }
getrandom = "0.3"
num-bigint = "0.5"
regex = "1"
sha2 = "0.11"
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
serde_json = "1.0"
