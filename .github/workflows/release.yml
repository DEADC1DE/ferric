name: Release

# Builds Ferric binaries (Linux and Windows) and attaches them to a GitHub release.
# Run it by pushing a tag (v*), or manually from the Actions tab with a tag name.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.2)"
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Ferric $tag" --generate-notes --prerelease
          fi

  linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config build-essential libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build ferric-app
        run: cargo build --release -p ferric-app

      - name: Package
        run: |
          dir="Ferric-${{ steps.tag.outputs.name }}-linux-x64"
          mkdir "$dir"
          cp target/release/ferric-app README.md LICENSE "$dir/"
          cp -r Scripts examples "$dir/"
          tar -czf "$dir.tar.gz" "$dir"

      - name: Attach Linux archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.name }}" "Ferric-${{ steps.tag.outputs.name }}-linux-x64.tar.gz" --clobber

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Determine tag
        id: tag
        shell: pwsh
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the UI
        working-directory: ui
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Build ferric-app
        shell: pwsh
        run: cargo build --release -p ferric-app

      - name: Package
        shell: pwsh
        run: |
          $dir = "Ferric-${{ steps.tag.outputs.name }}-windows-x64"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item target/release/ferric-app.exe "$dir/"
          Copy-Item README.md, LICENSE "$dir/"
          Copy-Item -Recurse Scripts, examples "$dir/"
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"

      - name: Attach Windows archive to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.name }}" "Ferric-${{ steps.tag.outputs.name }}-windows-x64.zip" --clobber
