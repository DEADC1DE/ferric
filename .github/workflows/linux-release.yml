name: Linux release

# Builds the Linux binary on an Ubuntu runner and attaches it to a GitHub release.
# Run it by pushing a tag (v*), or manually from the Actions tab with a tag name.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the Linux archive to, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config build-essential libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build ferric-app
        run: cargo build --release -p ferric-app

      - name: Package
        run: |
          dir="Ferric-${{ steps.tag.outputs.name }}-linux-x64"
          mkdir "$dir"
          cp target/release/ferric-app README.md LICENSE "$dir/"
          cp -r Scripts examples "$dir/"
          tar -czf "$dir.tar.gz" "$dir"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          archive="Ferric-${tag}-linux-x64.tar.gz"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$archive" --title "Ferric $tag" --generate-notes --prerelease
          else
            gh release upload "$tag" "$archive" --clobber
          fi
